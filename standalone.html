                    <div className="h-2 bg-slate-900 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-gradient-to-r from-blue-500 to-purple-500 rounded-full"
                        style={{ width: `${trk.util}%` }}
                      ></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Chart 4: Waiting & Dwell Time Breakdown */}
            <div className="p-5 rounded-2xl bg-[#0c1220] border border-slate-800 shadow-xl space-y-4">
              <div className="flex items-center justify-between">
                <h4 className="text-xs font-bold text-white uppercase tracking-wider font-mono">4. Waiting Time Distribution</h4>
                <span className="text-[10px] text-emerald-400 font-mono">Total Trains: 24</span>
              </div>

              <div className="grid grid-cols-2 gap-3 pt-2">
                {waitingTimeBreakdown.map((item, idx) => (
                  <div key={idx} className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800">
                    <span className="text-[11px] text-slate-400 block leading-tight">{item.category}</span>
                    <span className="text-2xl font-black font-mono text-white mt-1 block">{item.count}</span>
                    <span className="text-[10px] text-slate-500 font-mono">{Math.round((item.count/24)*100)}% of section fleet</span>
                  </div>
                ))}
              </div>
            </div>

          </div>

        </div>
      );
    }

    // =========================================================================
    // 11. ALERTS VIEW
    // =========================================================================
    function AlertsView({ alerts }) {
      const [filter, setFilter] = useState('all');

      const filtered = alerts.filter(a => {
        if (filter === 'critical') return a.type === 'critical';
        if (filter === 'warning') return a.type === 'warning';
        if (filter === 'info') return a.type === 'info';
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-[#0c1220] border border-slate-800 shadow-xl space-y-4">
            
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-base font-bold text-white flex items-center gap-2">
                  <Icons.Alerts />
                  <span>Central Railway Safety & Section Alerts</span>
                  <span className="text-[10px] px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 font-mono">
                    {alerts.length} RECORDED
                  </span>
                </h2>
                <p className="text-xs text-slate-400">Critical precedence conflicts, speed restrictions, and automated signal logs</p>
              </div>

              <div className="flex items-center gap-2">
                {['all', 'critical', 'warning', 'info'].map((f) => (
                  <button
                    key={f}
                    onClick={() => setFilter(f)}
                    className={`px-3 py-1 rounded-lg text-xs font-semibold uppercase font-mono transition-all ${
                      filter === f
                        ? 'bg-cyan-500 text-slate-950 font-bold shadow-md shadow-cyan-500/20'
                        : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
                    }`}
                  >
                    {f}
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-3">
              {filtered.map((alert) => {
                const badge = getStatusBadge(alert.type);
                return (
                  <div
                    key={alert.id}
                    className={`p-4 rounded-xl bg-slate-900/90 border ${badge.border} shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-4`}
                  >
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold font-mono uppercase border ${badge.bg} ${badge.text} ${badge.border}`}>
                          {alert.type}
                        </span>
                        <span className="text-sm font-bold text-white">{alert.title}</span>
                        <span className="text-xs text-slate-500 font-mono">• {alert.timestamp}</span>
                      </div>
                      <p className="text-xs text-slate-300">{alert.description}</p>
                      <div className="flex items-center gap-2 pt-1 text-[10px] text-slate-400 font-mono">
                        <span>Affected Train: <strong className="text-cyan-300">{alert.trainId}</strong></span>
                        <span>•</span>
                        <span>Track Sector: <strong className="text-cyan-300">{alert.trackId}</strong></span>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      <button className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition-colors">
                        Acknowledge
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // 12. SETTINGS VIEW
    // =========================================================================
    function SettingsView({ projectInfo }) {
      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-[#0c1220] border border-slate-800 shadow-xl space-y-6">
            
            <div>
              <h2 className="text-base font-bold text-white flex items-center gap-2">
                <Icons.Settings />
                <span>Control Room & Project Configuration</span>
              </h2>
              <p className="text-xs text-slate-400">Settings and parameter definitions for college major project demonstration</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
              
              <div className="p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                <h4 className="font-bold text-white uppercase font-mono text-[11px] text-cyan-400">Project Metadata</h4>
                <div className="space-y-2">
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">Project Title:</span>
                    <span className="text-white font-semibold">{projectInfo.name}</span>
                  </div>
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">Scope / Theme:</span>
                    <span className="text-cyan-300">{projectInfo.subtitle}</span>
                  </div>
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">Monitored Corridor:</span>
                    <span className="text-slate-200">{projectInfo.sectionName}</span>
                  </div>
                  <div className="flex justify-between py-1.5">
                    <span className="text-slate-400">System Build:</span>
                    <span className="text-emerald-400 font-mono">{projectInfo.version}</span>
                  </div>
                </div>
              </div>

              <div className="p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                <h4 className="font-bold text-white uppercase font-mono text-[11px] text-cyan-400">Display Parameters</h4>
                <div className="space-y-2">
                  <div className="flex items-center justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-300">Theme Mode:</span>
                    <span className="px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 font-mono font-bold">Dark Control Room</span>
                  </div>
                  <div className="flex items-center justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-300">Data Source Mode:</span>
                    <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 font-mono font-bold">Static / Decoupled Data</span>
                  </div>
                  <div className="flex items-center justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-300">Clock Sync:</span>
                    <span className="text-slate-300 font-mono">Realtime Local (1 sec tick)</span>
                  </div>
                  <div className="flex items-center justify-between py-1.5">
                    <span className="text-slate-300">Backend Ready:</span>
                    <span className="text-cyan-400 font-mono font-bold">Yes (Clean API Hook Points)</span>
                  </div>
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
